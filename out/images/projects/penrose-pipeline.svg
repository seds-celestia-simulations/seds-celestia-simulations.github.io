    <text x="138" y="202" text-anchor="middle" fill="#8aa3b5" font-size="11">8D (xμ, uμ)</text>

    <path d="M228 185 H268" stroke="#3db8f5" stroke-width="2" marker-end="url(#arrow)"/>
    <polygon points="268,185 256,179 256,191" fill="#3db8f5"/>

    <rect x="280" y="140" width="180" height="90" fill="#0d3a4a" stroke="#3db8f5" stroke-width="1.5"/>
    <text x="370" y="178" text-anchor="middle" fill="#e8f4f8" font-size="15" font-weight="700">METRIC</text>
    <text x="370" y="202" text-anchor="middle" fill="#8aa3b5" font-size="11">gμν (Schwarzschild)</text>

    <polygon points="500,185 488,179 488,191" fill="#3db8f5"/>
    <path d="M460 185 H488" stroke="#3db8f5" stroke-width="2"/>

    <rect x="512" y="140" width="180" height="90" fill="#0d3a4a" stroke="#3db8f5" stroke-width="1.5"/>
    <text x="602" y="178" text-anchor="middle" fill="#e8f4f8" font-size="15" font-weight="700">Γμ αβ</text>
    <text x="602" y="202" text-anchor="middle" fill="#8aa3b5" font-size="11">Christoffel</text>

    <path d="M692 185 H720" stroke="#3db8f5" stroke-width="2"/>
    <polygon points="732,185 720,179 720,191" fill="#3db8f5"/>

    <rect x="744" y="140" width="180" height="90" fill="#0d3a4a" stroke="#3db8f5" stroke-width="1.5"/>
    <text x="834" y="178" text-anchor="middle" fill="#e8f4f8" font-size="15" font-weight="700">RK4</text>
    <text x="834" y="202" text-anchor="middle" fill="#8aa3b5" font-size="11">Integrator</text>

    <path d="M924 185 H952" stroke="#3db8f5" stroke-width="2"/>
    <polygon points="964,185 952,179 952,191" fill="#3db8f5"/>

    <rect x="976" y="140" width="176" height="90" fill="#12202a" stroke="#3db8f5" stroke-width="1.5"/>
    <text x="1064" y="178" text-anchor="middle" fill="#e8f4f8" font-size="15" font-weight="700">PATH</text>
    <text x="1064" y="202" text-anchor="middle" fill="#8aa3b5" font-size="11">CSV / render</text>
  </g>

  <!-- dual pipeline strip -->
  <rect x="48" y="280" width="528" height="180" fill="#0a1822" stroke="#1e4a5c" stroke-width="1"/>
  <rect x="624" y="280" width="528" height="180" fill="#0a1822" stroke="#1e4a5c" stroke-width="1"/>
  <text x="72" y="312" fill="#3db8f5" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2">CPU // REFERENCE</text>
