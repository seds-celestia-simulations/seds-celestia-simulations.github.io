  <text x="72" y="372" fill="#8aa3b5" font-family="ui-monospace, monospace" font-size="12">Free-fall · orbital invariants · norm</text>
  <text x="72" y="416" fill="#8aa3b5" font-family="ui-monospace, monospace" font-size="12">physics/</text>

  <text x="648" y="312" fill="#3db8f5" font-family="ui-monospace, monospace" font-size="13" letter-spacing="2">GPU // REALTIME</text>
  <text x="648" y="348" fill="#c8d8e4" font-family="ui-monospace, monospace" font-size="13">OpenGL · GLSL · 1 geodesic / pixel</text>
  <text x="648" y="372" fill="#8aa3b5" font-family="ui-monospace, monospace" font-size="12">Horizon · disk SSBO · skybox escape</text>
  <text x="648" y="416" fill="#8aa3b5" font-family="ui-monospace, monospace" font-size="12">realtime/</text>
</svg>
