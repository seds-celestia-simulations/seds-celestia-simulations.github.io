<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="100%" stop-color="#0d1c28"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <g stroke="#1e3a4a" stroke-width="1">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200 M0 400 H1200 M0 480 H1200"/>
    <path d="M80 0 V520 M160 0 V520 M240 0 V520 M320 0 V520 M400 0 V520 M480 0 V520 M560 0 V520 M640 0 V520 M720 0 V520 M800 0 V520 M880 0 V520 M960 0 V520 M1040 0 V520 M1120 0 V520"/>
  </g>
  <text x="48" y="48" fill="#3db8f5" font-family="ui-monospace, monospace" font-size="14" letter-spacing="3">PENROSE // PHYSICS PIPELINE</text>
  <text x="48" y="78" fill="#8aa3b5" font-family="ui-monospace, monospace" font-size="12">Matter → Metric → Connection → Geodesic ODE → Trajectory</text>

  <!-- boxes -->
  <g font-family="ui-monospace, monospace">
    <rect x="48" y="140" width="180" height="90" fill="#0d3a4a" stroke="#3db8f5" stroke-width="1.5"/>
